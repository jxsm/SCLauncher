name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release 发布信息 (留空则自动生成)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # 从 wails.json 读取版本号（版本号唯一来源）
          $appinfoVersion = ""
          $wails = Get-Content "wails.json" -Raw | ConvertFrom-Json
          if ($wails.info.productVersion) {
            $appinfoVersion = $wails.info.productVersion
          }

          if ("${{ github.event_name }}" -eq "push") {
            # Tag 触发：直接以 push 的 tag 作为版本号
            $tagName = "${{ github.ref_name }}"
            $version = $tagName -replace '^v', ''
          } else {
            # 手动触发：使用 wails.json 中的版本号
            if (-not $appinfoVersion) {
              Write-Error "无法从 wails.json 读取版本号 (info.productVersion)"
              exit 1
            }
            $version = $appinfoVersion
            $tagName = "v$version"
          }

          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          Write-Output "版本号: $version (tag: $tagName)"

          # 一致性检查：wails.json 与 tag 是否一致
          if ($appinfoVersion -and $appinfoVersion -ne $version) {
            Write-Output "version_match=false" >> $env:GITHUB_OUTPUT
            Write-Output "appinfo_version=$appinfoVersion" >> $env:GITHUB_OUTPUT
            Write-Warning "wails.json 版本号 ($appinfoVersion) 与 tag ($version) 不一致，构建产物内部版本号以 wails.json 为准，建议下次发布前同步"
          } else {
            Write-Output "version_match=true" >> $env:GITHUB_OUTPUT
          }

          # 获取上一个 tag
          $previousTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($previousTag) {
            Write-Output "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
            Write-Output "上一个 tag: $previousTag"
          } else {
            Write-Output "previous_tag=" >> $env:GITHUB_OUTPUT
            Write-Output "未找到上一个 tag"
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Wails application
        run: wails build -clean -platform windows/amd64

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $distPath = "build\bin"
          $outputPath = "release"

          New-Item -ItemType Directory -Force -Path $outputPath

          # 创建 zip 文件
          $exePath = Get-ChildItem -Path $distPath -Filter "*.exe" | Select-Object -First 1
          if ($exePath) {
            $zipFileName = "SCLauncher-$version-windows-amd64.zip"
            Compress-Archive -Path $exePath.FullName -DestinationPath "$outputPath\$zipFileName"
            Write-Output "Created: $zipFileName"
          }

          # 复制 exe 文件
          Copy-Item -Path $exePath.FullName -Destination "$outputPath\SCLauncher-$version-windows-amd64.exe"

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $customNotes = '${{ github.event.inputs.release_notes }}'
          $version = "${{ steps.version.outputs.version }}"
          $tagName = "${{ steps.version.outputs.tag_name }}"
          $previousTag = "${{ steps.version.outputs.previous_tag }}"

          # Tag 触发时读取 annotated tag 的注释内容作为发布说明
          $tagNotes = ""
          if ("${{ github.event_name }}" -eq "push") {
            $raw = git for-each-ref "refs/tags/${{ github.ref_name }}" --format="%(contents)"
            if ($LASTEXITCODE -eq 0 -and $raw) {
              $tagNotes = ($raw -join "`n").Trim()
            }
          }

          # 优先级：手动输入 > tag 注释 > 自动生成
          if ($customNotes -ne "") {
            $notes = $customNotes
          } elseif ($tagNotes -ne "") {
            $notes = $tagNotes
          } else {
            $notes = "## What's New`n`n"

            # 获取从上一个 tag 到现在的提交
            if ($previousTag -ne "") {
              $commitLines = git log --pretty=format:"%s|%h" $previousTag..HEAD
            } else {
              # 如果没有上一个 tag，只显示最近的 10 个提交
              $commitLines = git log --pretty=format:"%s|%h" -10 HEAD
            }

            $commitArray = $commitLines -split "`n"

            if ($commitArray.Count -gt 0 -and $commitArray[0] -ne "") {
              $notes += "### Changes`n`n"
              $counter = 1
              foreach ($commit in $commitArray) {
                if ($commit -match "\|") {
                  $parts = $commit -split "\|"
                  $message = $parts[0]
                  $hash = $parts[1]
                  $notes += "$counter. $message ($hash)`n"
                  $counter++
                }
              }
              $notes += "`n"
            } else {
              $notes += "### Changes`n`n* Version bump to $version`n`n"
            }

            $notes += "---`n`n"
            $notes += "**Download:** Choose the asset below that matches your system.`n`n"
            if ($previousTag -ne "") {
              $notes += "**Full Changelog:** https://github.com/${{ github.repository }}/compare/$previousTag...$tagName"
            } else {
              $notes += "**Full Changelog:** https://github.com/${{ github.repository }}/commits/$tagName"
            }
          }

          # 将换行符转换为 GitHub Actions 可以处理的格式
          $notes = $notes -replace "`n", "%0A"
          $notes = $notes -replace "`r", ""
          Write-Output "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: SCLauncher ${{ steps.version.outputs.tag_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            release/SCLauncher-*-windows-amd64.exe
            release/SCLauncher-*-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: pwsh
        run: |
          Write-Output "## 构建完成! :rocket:" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **触发方式:** ${{ github.event_name == 'push' && 'Tag 推送' || '手动触发' }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **版本:** ${{ steps.version.outputs.tag_name }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **上一个 Tag:** ${{ steps.version.outputs.previous_tag }}" >> $env:GITHUB_STEP_SUMMARY
          if ("${{ steps.version.outputs.version_match }}" -eq "false") {
            Write-Output "- **⚠️ 注意:** wails.json 版本号 (${{ steps.version.outputs.appinfo_version }}) 与 tag 不一致，产物内部版本号未同步" >> $env:GITHUB_STEP_SUMMARY
          }
          Write-Output "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}" >> $env:GITHUB_STEP_SUMMARY
