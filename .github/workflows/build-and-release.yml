name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release 发布信息 (留空则自动生成)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from appinfo.go
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "backend\appinfo\appinfo.go" -Raw
          if ($content -match 'Version\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            Write-Output "version=$version" >> $env:GITHUB_OUTPUT
            Write-Output "从 appinfo.go 读取版本号: v$version"
          } else {
            Write-Error "无法找到版本号"
            exit 1
          }

          # 获取上一个 tag
          $previousTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($previousTag) {
            Write-Output "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
            Write-Output "上一个 tag: $previousTag"
          } else {
            Write-Output "previous_tag=" >> $env:GITHUB_OUTPUT
            Write-Output "未找到上一个 tag"
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Wails application
        run: wails build -clean -platform windows/amd64

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $distPath = "build\bin"
          $outputPath = "release"

          New-Item -ItemType Directory -Force -Path $outputPath

          # 创建 zip 文件
          $exePath = Get-ChildItem -Path $distPath -Filter "*.exe" | Select-Object -First 1
          if ($exePath) {
            $zipFileName = "SCLauncher-$version-windows-amd64.zip"
            Compress-Archive -Path $exePath.FullName -DestinationPath "$outputPath\$zipFileName"
            Write-Output "Created: $zipFileName"
          }

          # 复制 exe 文件
          Copy-Item -Path $exePath.FullName -Destination "$outputPath\SCLauncher-$version-windows-amd64.exe"

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $customNotes = "${{ github.event.inputs.release_notes }}"
          $version = "${{ steps.version.outputs.version }}"
          $previousTag = "${{ steps.version.outputs.previous_tag }}"

          if ($customNotes -ne "") {
            $notes = $customNotes
          } else {
            $notes = "## What's New`n`n"

            # 获取从上一个 tag 到现在的提交
            if ($previousTag -ne "") {
              $commitLines = git log --pretty=format:"%s|%h" $previousTag..HEAD
            } else {
              # 如果没有上一个 tag，只显示最近的 10 个提交
              $commitLines = git log --pretty=format:"%s|%h" -10 HEAD
            }

            $commitArray = $commitLines -split "`n"

            if ($commitArray.Count -gt 0 -and $commitArray[0] -ne "") {
              $notes += "### Changes`n`n"
              $counter = 1
              foreach ($commit in $commitArray) {
                if ($commit -match "\|") {
                  $parts = $commit -split "\|"
                  $message = $parts[0]
                  $hash = $parts[1]
                  $notes += "$counter. $message ($hash)`n"
                  $counter++
                }
              }
              $notes += "`n"
            } else {
              $notes += "### Changes`n`n* Version bump to $version`n`n"
            }

            $notes += "---`n`n"
            $notes += "**Download:** Choose the asset below that matches your system.`n`n"
            $notes += "**Full Changelog:** https://github.com/${{ github.repository }}/commits/v$version"
          }

          # 将换行符转换为 GitHub Actions 可以处理的格式
          $notes = $notes -replace "`n", "%0A"
          $notes = $notes -replace "`r", ""
          Write-Output "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SCLauncher v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            release/SCLauncher-*-windows-amd64.exe
            release/SCLauncher-*-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: pwsh
        run: |
          Write-Output "## 构建完成! :rocket:" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **版本:** v${{ steps.version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **上一个 Tag:** ${{ steps.version.outputs.previous_tag }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Release:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
